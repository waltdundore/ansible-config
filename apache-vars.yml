---
# Apache-specific variables
apache_version: "2.4"
apache_port: 80
apache_ssl_port: 443
apache_document_root: "/var/www/html"
apache_server_admin: "admin@localhost"
apache_server_name: "localhost"

# Apache modules to enable
apache_modules:
  - mod_rewrite
  - mod_ssl
  - mod_security2
  - mod_headers
  - mod_deflate

# SSL Configuration
ssl_enabled: true
ssl_certificate_path: "/etc/ssl/certs/apache-selfsigned.crt"
ssl_private_key_path: "/etc/ssl/private/apache-selfsigned.key"
ssl_protocols: "TLSv1.2 TLSv1.3"
ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Security settings
apache_security_headers: true
apache_hide_version: true
apache_disable_trace: true
apache_disable_server_info: true

# Performance settings
apache_max_request_workers: 150
apache_threads_per_child: 25
apache_server_limit: 16

# Firewall settings (extends common firewall_allowed_ports)
firewall_allowed_ports:
  - "{{ ssh_port }}/tcp"
  - "{{ apache_port }}/tcp"
  - "{{ apache_ssl_port }}/tcp"
