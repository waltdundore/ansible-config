---
# Workstation Environment Configuration

ssh:
  public_key: ~/.ssh/id_ed25519.pub

ansible:
  playbook: site
  roles:
    - common
    - docker

vagrant:
  cpus: 4
  memory: 16384
  vms:
    - name: localhost
      box: bento/fedora-43
      hostname: workstation

common:
  user: "{{ ansible_user }}"
  packages:
    - vim
    - git
    - htop
    - code

docker:
  users:
    - "{{ ansible_user }}"
